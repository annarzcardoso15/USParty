{% load static %}
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USParty - Revenda de ingressos </title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>
    <nav class="navbar">
        <div class="logo"> USParty</div>
        <div class="links">
            <a href="{% url 'feed_festas' %}">Festas</a>
            {% if user.is_authenticated %}
                <a href="{% url 'meus_anuncios' %}">Meus Ingressos</a>
                <a href="{% url 'minhas_compras' %}">Minhas Compras</a>
                <a href="{% url 'interessados' %}">Interessados</a>
                <a href="{% url 'perfil' %}">Perfil ({{ user.username }})</a>
                <a href="{% url 'logout' %}">Sair</a>
            {% else %}
                <a href="{% url 'login' %}">Entrar</a>
                <a href="{% url 'cadastro' %}">Cadastrar</a>
            {% endif %}
        </div>
    </nav>

    <main style="padding: 20px;">
        {% block content %}
        {% endblock %}
    </main>

</body>

</html>
