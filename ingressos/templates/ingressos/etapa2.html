{% extends 'base.html' %} 

{% block content %}
<style>

    .caixa-ingresso {
        border: 1px solid #e0e0e0;
        padding: 30px;
        margin-bottom: 30px; 
        border-radius: 12px;
        text-align: left;
        background-color: white;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.03);
    }

    .caixa-ingresso p {
        margin-bottom: 20px; 
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        font-weight: 500;
        color: var(--vintage-berry);
    }


    .caixa-ingresso input, .caixa-ingresso select {
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 8px;
        width: 100%;
        max-width: 300px;
        margin-top: 8px;
        font-size: 15px;
    }
</style>

<main style="display: flex; justify-content: center; padding-top: 60px; padding-bottom: 60px;">
    
    <div class="conteudo-festas" style="text-align: center; width: 100%; max-width: 600px;">
        
        <h2 style="margin-bottom: 30px;">Passo 2: Detalhes dos Ingressos</h2>
        
        <form method="POST" action="">
            {% csrf_token %}
            
            {{ formset.management_form }}
            
            {% for form in formset %}
                <div class="caixa-ingresso">
                    <h3 style="color: var(--cerulean); margin-bottom: 20px; border-bottom: 1px solid #f0f0f0; padding-bottom: 10px;">
                        Ingresso {{ forloop.counter }}
                    </h3>
                    
                    {{ form.as_p }}
                </div>
            {% endfor %}
            
            <br>
            <button type="submit" class="btn-primary" style="padding: 12px 25px; border-radius: 8px; font-size: 16px;">
                Anunciar Todos os Ingressos
            </button>
        </form>
    </div>

</main>
{% endblock %}
