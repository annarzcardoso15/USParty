{% extends 'base.html' %}
{% block content %}

<div style="display: flex; justify-content: center; padding-top: 60px; padding-bottom: 60px;">
    <div style="background: #fff; padding: 40px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 450px;">
        <h2 style="color: var(--cerulean); text-align: center; margin-bottom: 30px;">Editar Anúncio</h2>
        
        <form method="POST">
            {% csrf_token %}
            
            <div style="margin-bottom: 20px;">
                <label style="display: block; font-weight: bold; margin-bottom: 5px;">Preço (R$):</label>
                <input type="number" step="0.01" name="preco" value="{{ anuncio.preco }}" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px;">
            </div>

            <div style="margin-bottom: 30px;">
                <label style="display: block; font-weight: bold; margin-bottom: 5px;">Status do Ingresso:</label>
                <select name="status_escolhido" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px;">
                    <option value="disponivel" {% if anuncio.status.disponivel %}selected{% endif %}>🟢 Disponível</option>
                    <option value="em_negociacao" {% if anuncio.status.em_negociacao %}selected{% endif %}>🟡 Em Negociação</option>
                    <option value="vendido" {% if anuncio.status.vendido %}selected{% endif %}>🔴 Vendido</option>
                </select>
            </div>

            <div style="display: flex; gap: 10px; justify-content: space-between;">
                <a href="{% url 'meus_anuncios' %}" style="padding: 10px 20px; background: #eee; color: #333; text-decoration: none; border-radius: 4px; text-align: center; width: 48%;">Cancelar</a>
                <button type="submit" class="btn-primary" style="padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; width: 48%;">Salvar</button>
            </div>
        </form>
    </div>
</div>

{% endblock %}
