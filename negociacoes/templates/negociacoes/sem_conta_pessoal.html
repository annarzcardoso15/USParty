{% extends 'base.html' %}

{% block content %}
<div style="max-width: 500px; margin: 60px auto; background-color: #fff5f7; padding: 35px; border-radius: 15px; text-align: center;">
    <h2 style="color: var(--vintage-berry);">Página só para contas pessoais</h2>
    <p style="margin: 20px 0;">
        Você está logada como <strong>{{ user.username }}</strong>, que não é uma conta pessoal.
        Comprar e vender ingressos é só para contas pessoais (alunos e não-alunos).
    </p>
    <a href="{% url 'feed_festas' %}" class="btn-primary">Voltar para as festas</a>
    <a href="{% url 'logout' %}" style="display: block; margin-top: 15px;">Sair e entrar com outra conta</a>
</div>
{% endblock %}
